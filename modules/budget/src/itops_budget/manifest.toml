name = "budget"
version = "0.8.2"
title = "Budget"
nav_order = 40
description = "Device budget: a 12-month forecast from the fleet, hiring history, purchase history and a price list, every line showing what it rests on."
requires = ["core>=0.1"]
optional = ["assets", "reports"]
provides = ["dashboards", "waiting"]

# Every figure here is money, so all of it is granted by AD group, not by role (ADR 0016).
# The deployment maps each to groups in ITOPS_PERMISSION_GROUPS; admins hold them all.
[permissions]
"budget.read" = { description = "View the device budget forecast and saved versions", grant = "group" }
"budget.write" = { description = "Change the budget's assumptions and price list, and save versions (every change is audited)", grant = "group" }
"budget.approve" = { description = "Mark a saved version adopted, and approve or reject changes AI proposed", human_only = true, grant = "group" }

[events]
version_adopted = "A saved budget version was marked adopted (payload: id, title, total)"
