[project]
name = "itops-kb"
version = "0.3.0"
description = "How-tos for staff on the help site: Docs written for end users, and what people think of them."
requires-python = ">=3.12"
dependencies = ["itops-core"]

[project.entry-points."itops.modules"]
kb = "itops_kb:module"

[tool.uv.sources]
itops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itops_kb"]
