[project]
name = "itops-reports"
version = "0.1.0"
description = "Reports module for IT-Ops."
requires-python = ">=3.12"
dependencies = ["itops-core"]

[project.entry-points."itops.modules"]
reports = "itops_reports:module"

[tool.uv.sources]
itops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itops_reports"]
