[project]
name = "itops-core"
version = "0.1.0"
description = "IT-Ops platform core and module SDK."
requires-python = ">=3.12"
authors = [{ name = "Justin Lee" }]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # file uploads (UploadFile)
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "pyodbc>=5.2",          # SQL Server via Microsoft ODBC Driver 18
    "aioodbc>=0.5",         # async wrapper used by SQLAlchemy's mssql+aioodbc dialect
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "packaging>=24",
    "mcp>=2,<3",
    "nh3>=0.2.19",          # HTML sanitizer (Rust ammonia): content is sanitized on save
    "markdown-it-py>=3.0",  # markdown -> HTML, for AI and import convenience
    "fastembed>=0.8",       # local ONNX embedding models (AI tier 2, semantic search)
    "msal>=1.31",           # Entra ID sign-in (authorization-code flow, id token checks)
    "itsdangerous>=2.2",    # signed session cookie (Starlette SessionMiddleware)
    "python-dotenv>=1.0",   # connector secrets from the same .env the settings read
    "httpx>=0.27",          # the embedded LLM's HTTP API (ADR 0015)
    # Text of uploaded files, by page (ADR 0015): search and AI suggestions read it.
    "pypdf>=5.0",           # PDF text layer
    "python-docx>=1.1",     # Word
    "openpyxl>=3.1",        # Excel
    "olefile>=0.47",        # Outlook .msg (an OLE file: subject, sender, date, body)
]

[project.scripts]
itops = "itops.cli:main"

[project.entry-points.pytest11]
itops = "itops.testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itops"]
